version: '3.8'

services:
  web:
    build: .
    container_name: easytesting-web
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=easy_testing.settings
      - DATABASE_URL=postgres://django:password@db:5432/easytesting
    depends_on:
      - db
      - redis
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    networks:
      - easytesting-network
    restart: unless-stopped

  db:
    image: postgres:13
    container_name: easytesting-db
    environment:
      - POSTGRES_DB=easytesting
      - POSTGRES_USER=django
      - POSTGRES_PASSWORD=password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - easytesting-network
    restart: unless-stopped

  redis:
    image: redis:6-alpine
    container_name: easytesting-redis
    networks:
      - easytesting-network
    restart: unless-stopped

  nginx:
    image: nginx:1.21-alpine
    container_name: easytesting-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - web
    networks:
      - easytesting-network
    restart: unless-stopped

volumes:
  postgres_data:
  static_volume:
  media_volume:

networks:
  easytesting-network:
    driver: bridge